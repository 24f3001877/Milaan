name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src/
      - run: uv run lint-imports
      - run: uv run detect-secrets scan --baseline .secrets.baseline

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: milaan
          POSTGRES_PASSWORD: milaan
          POSTGRES_DB: milaan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U milaan"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://milaan:milaan@localhost:5432/milaan
      DATABASE_URL_SYNC: postgresql+psycopg://milaan:milaan@localhost:5432/milaan
      REDIS_URL: redis://localhost:6379/0
      LLM_MODE: cached
      API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -m "not slow" --cov --cov-fail-under=80
      - run: uv run pytest -m hypothesis
      - run: uv run pytest -m security

  eval:
    needs: [static, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --extra dev
      - run: uv run python -m milaan.adapters.synthetic.generate --seed 42 --records 5000 --out data/synthetic
      - run: uv run python -m milaan.eval.run --data-dir data/synthetic
      - run: uv run python -m milaan.eval.gate metrics.json --mode deterministic_only
        # deterministic_only (GATE 1, Implementation Plan §6.2) until the LLM triage layer
        # exists; switch to the default full-gate mode (config/eval_thresholds.json) once
        # tasks 2.10-2.17 land.
      - uses: actions/upload-artifact@v4
        with:
          name: eval-metrics
          path: |
            metrics.json
            metrics.md
