[project]
name = "milaan"
version = "0.1.0"
description = "Milaan — three-way settlement reconciliation agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "pandas>=2.2",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "detect-secrets>=1.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milaan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["milaan"]

[tool.ruff.lint.per-file-ignores]
"src/milaan/app/**/*.py" = ["B008"]
"src/milaan/adapters/db/enums.py" = ["UP042"]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests excluded from the default CI run",
    "hypothesis: property-based money invariant tests",
    "security: prompt-injection and adversarial-input regression tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/milaan/domain"]

[tool.coverage.report]
fail_under = 80

[tool.importlinter]
root_package = "milaan"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has zero I/O and zero framework imports"
type = "forbidden"
source_modules = ["milaan.domain"]
forbidden_modules = [
    "milaan.adapters",
    "milaan.app",
    "fastapi",
    "sqlalchemy",
    "celery",
    "httpx",
    "redis",
]

[[tool.importlinter.contracts]]
name = "Adapters do not import app (routes/tasks/DI)"
type = "forbidden"
source_modules = ["milaan.adapters"]
forbidden_modules = ["milaan.app"]
